<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dettaglio Bollettino - CRM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/crm.css" rel="stylesheet">
</head>
<body class="crm-app">
<div id="topnav" data-active="bollettini.html"></div>
<main class="crm-pagina" id="pagina"></main>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/componenti.js"></script>
<script>
/* Composizione: Intestazione + KpiRow (con selettore stato) + DataTable fatture + Nota */
const idBollettino = parseInt(new URLSearchParams(location.search).get('id'), 10)
  || parseInt(sessionStorage.getItem('bollettinoId'), 10);
const bollettino = DATA.bollettini.find(b => b.id === idBollettino);
const periodo = b => fornitoreNome(b.fornitore_id) + ' — ' + meseLabel(b.mese) + ' ' + b.anno;

const intestazione = CRM.Intestazione('#pagina', {
  briciole: [{ etichetta: 'Bollettini', href: 'bollettini.html' }, { etichetta: bollettino ? periodo(bollettino) : '#' }],
  titolo: bollettino ? periodo(bollettino) : '', icona: 'bi-receipt',
  azioni: [{ etichetta: 'Indietro', icona: 'bi-arrow-left', variante: 'outline-secondary', piccolo: true, href: 'bollettini.html' }]
});

if (!bollettino) {
  CRM.Errore('#pagina', 'Bollettino non trovato.');
} else {
  const kpi = CRM.KpiRow('#pagina', [
    { id: 'ricon', etichetta: 'Riconosciuto' },
    { id: 'calc', etichetta: 'Calcolato', variante: 'info', colorato: false },
    { id: 'diff', etichetta: 'Differenza' },
    { contenuto: '<label class="form-label small mb-1">Stato</label>' +
      '<select class="form-select form-select-sm" id="selStato">' +
      '<option value="da_verificare">Da verificare</option><option value="verificato">Verificato</option><option value="contestato">Contestato</option></select>' }
  ]);
  document.getElementById('selStato').addEventListener('change', cambiaStato);

  const clsDiff = v => v > 0 ? 'text-danger fw-bold' : v < 0 ? 'text-success' : '';
  const tabella = CRM.DataTable(CRM.blocco('#pagina', { riempi: true }), {
    titolo: 'Fatture Bollettino', icona: 'bi-list-ul', contatore: true,
    azioniTestata: [{ etichetta: 'Aggiungi Fattura', icona: 'bi-plus', onClick: apriModaleRiga }],
    colonne: [
      { key: 'fattura_numero', header: 'Fattura N.', classe: 'fw-semibold' },
      { key: 'fattura_data', header: 'Data', tipo: 'data' },
      { key: 'cliente', header: 'Cliente', grow: true, valore: r => clienteNome(r.cliente_piva) },
      { key: 'importo_merce', header: 'Merce', tipo: 'euro' },
      { key: 'pct_riconosciuta', header: '% Ricon.', tipo: 'pct' },
      { key: 'importo_riconosciuto', header: 'Importo Ricon.', tipo: 'euro' },
      { key: 'pct_calcolata', header: '% Calc.', tipo: 'pct' },
      { key: 'importo_calcolato', header: 'Importo Calc.', tipo: 'euro' },
      { key: 'differenza', header: 'Differenza', tipo: 'euro', cell: r => '<span class="' + clsDiff(r.differenza) + '">' + fmtEuro(r.differenza) + '</span>' }
    ],
    rowKey: (r, i) => (r.fattura_numero || '') + '-' + i,
    azioni: [{ icona: 'bi-trash', tooltip: 'Elimina', variante: 'danger', onClick: r => eliminaRiga(r.fattura_numero) }],
    emptyText: 'Nessuna fattura inserita'
  });
  const boxNote = CRM.blocco('#pagina');

  function renderHeader() {
    intestazione.aggiorna({ titolo: periodo(bollettino), badge: CRM.badgeStato(bollettino.stato) });
    document.getElementById('selStato').value = bollettino.stato;
  }
  function renderKpi() {
    const t = bollettinoTotali(bollettino);
    kpi.aggiorna('ricon', fmtEuro(t.riconosciuto));
    kpi.aggiorna('calc', fmtEuro(t.calcolato));
    kpi.aggiorna('diff', fmtEuro(t.differenza), t.differenza > 0 ? 'danger' : t.differenza < 0 ? 'success' : '');
  }
  function renderRighe() {
    tabella.aggiorna(bollettinoRighe(bollettino));
    boxNote.innerHTML = '';
    if (bollettino.note) CRM.Nota(boxNote, CRM.esc(bollettino.note), 'avviso');
  }
  function apriModaleRiga() {
    CRM.FormModal({
      titolo: 'Aggiungi Fattura',
      campi: [
        { nome: 'fattura_numero', etichetta: 'N. Fattura', obbligatorio: true, col: 'col-md-6' },
        { nome: 'fattura_data', etichetta: 'Data Fattura', tipo: 'data', col: 'col-md-6' },
        { nome: 'cliente_piva', etichetta: 'Cliente', tipo: 'select', opzioni: () => CRM.opz.clienti('—'), col: 'col-md-6' },
        { nome: 'importo_merce', etichetta: 'Importo Merce €', tipo: 'numero', passo: '0.01', col: 'col-md-6' },
        { nome: 'pct_riconosciuta', etichetta: '% Riconosciuta', tipo: 'numero', passo: '0.01', col: 'col-md-6' },
        { nome: 'importo_riconosciuto', etichetta: 'Importo Riconosciuto €', tipo: 'numero', passo: '0.01', col: 'col-md-6' }
      ],
      nota: 'L\'importo calcolato e la differenza vengono calcolati automaticamente in base agli scaglioni del fornitore (sezione §10).',
      onConferma: function (f) {
        if (!f.fattura_numero) { showToast('Numero fattura obbligatorio', false); return false; }
        ['importo_merce', 'pct_riconosciuta', 'importo_riconosciuto'].forEach(k => { if (f[k]) f[k] = parseFloat(f[k]); });
        if (!bollettino.righe) bollettino.righe = [];
        bollettino.righe.push(f);
        renderKpi(); renderRighe(); renderHeader();
        showToast('Fattura aggiunta');
      }
    });
  }
  function eliminaRiga(numero) {
    if (!conferma('Eliminare questa riga?')) return;
    bollettino.righe = (bollettino.righe || []).filter(r => r.fattura_numero !== numero);
    renderKpi(); renderRighe();
  }
  function cambiaStato() {
    bollettino.stato = document.getElementById('selStato').value;
    renderHeader();
    showToast('Stato aggiornato a "' + bollettino.stato.replace('_', ' ') + '"');
  }

  renderHeader(); renderKpi(); renderRighe();
}
</script>
</body>
</html>
