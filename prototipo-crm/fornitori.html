<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fornitori - CRM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/crm.css" rel="stylesheet">
</head>
<body class="crm-app">
<div id="topnav" data-active="fornitori.html"></div>
<main class="crm-pagina" id="pagina"></main>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/componenti.js"></script>
<script>
/* Composizione: Intestazione + DataTable + Nota */
function scontiAssociati(fornitoreId) {
  const disc = DATA.interscambio.filter(x => x.fornitore_id === fornitoreId).map(x => x.discount);
  if (!disc.length) return null;
  const min = Math.min.apply(null, disc), max = Math.max.apply(null, disc);
  return { min: min, testo: min === max ? min + '%' : min + '–' + max + '%' };
}
const aperti = f => DATA.ordini.filter(o => o.fornitore_id === f.id && o.stato !== 'fatturato').length;

CRM.Intestazione('#pagina', {
  titolo: 'Fornitori', icona: 'bi-building',
  azioni: [{ etichetta: 'Nuovo Fornitore', icona: 'bi-plus-lg', onClick: apriModaleNuovo }]
});

const tabella = CRM.DataTable(CRM.blocco('#pagina', { riempi: true }), {
  colonne: [
    { key: 'ragione_sociale', header: 'Fornitore', grow: true,
      cell: f => '<a href="fornitore-dettaglio.html?id=' + f.id + '" class="text-decoration-none fw-semibold">' + CRM.esc(f.ragione_sociale) + '</a>' },
    { key: 'piva', header: 'P.IVA' },
    { key: 'giorni_attesa_conferma', header: 'Giorni attesa', tipo: 'numero', align: 'center', valore: f => f.giorni_attesa_conferma || 30 },
    { key: 'payment_type', header: 'Pagamento', align: 'center',
      cell: f => f.payment_type === 'matured' ? '<span class="badge border border-secondary text-secondary">Maturato</span>' : '<span class="badge border border-primary text-primary">Fatturato</span>' },
    { key: 'sconto', header: 'Sconto assoc.', align: 'center',
      sortValue: f => { const s = scontiAssociati(f.id); return s ? s.min : -1; },
      cell: f => { const s = scontiAssociati(f.id); return s ? s.testo : '—'; } },
    { key: 'aperti', header: 'Ordini Aperti', tipo: 'numero', align: 'center', valore: aperti,
      cell: f => { const n = aperti(f); return n > 0 ? '<span class="badge bg-warning text-dark">' + n + '</span>' : '<span class="text-muted">0</span>'; } },
    { key: 'attivo', header: 'Stato', valore: f => f.attivo ? 1 : 0, sortValue: f => f.attivo ? 0 : 1,
      cell: f => CRM.badgeAttivo(f.attivo) }
  ],
  righe: DATA.fornitori,
  azioni: [{ icona: 'bi-pencil', tooltip: 'Dettaglio', href: f => 'fornitore-dettaglio.html?id=' + f.id }],
  rowHref: f => 'fornitore-dettaglio.html?id=' + f.id,
  emptyText: 'Nessun fornitore'
});

CRM.Nota('#pagina',
  '<strong>Pagamento provvigioni</strong> (§4.4): <span class="badge bg-secondary">Maturato</span> = ' +
  'pagamento su incassi clienti (es. Gries), <span class="badge bg-secondary">Fatturato</span> = ' +
  'pagamento sul fatturato confermato (es. Gasper, Ing\'s). Sconto assoc. mostra i valori ' +
  'definiti nelle tabelle di interscambio per il fornitore.');

function apriModaleNuovo() {
  CRM.FormModal({
    titolo: 'Nuovo Fornitore',
    campi: [
      { nome: 'ragione_sociale', etichetta: 'Ragione Sociale', obbligatorio: true },
      { nome: 'piva', etichetta: 'P.IVA', col: 'col-md-6' },
      { nome: 'giorni_attesa_conferma', etichetta: 'Giorni attesa conferma', tipo: 'numero', min: 0, valore: 30, col: 'col-md-6' },
      { nome: 'payment_type', etichetta: 'Pagamento provvigioni', tipo: 'select', opzioni: CRM.opz.pagamento, col: 'col-md-6' },
      { nome: 'note', etichetta: 'Note', tipo: 'area' }
    ],
    onConferma: function (f) {
      if (!f.ragione_sociale) { showToast('Ragione sociale obbligatoria', false); return false; }
      f.id = CRM.nuovoId(DATA.fornitori);
      f.giorni_attesa_conferma = parseInt(f.giorni_attesa_conferma) || 30;
      f.attivo = true;
      DATA.fornitori.push(f);
      showToast('Fornitore creato');
      tabella.aggiorna(DATA.fornitori);
    }
  });
}
</script>
</body>
</html>
