<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dettaglio Ordine - CRM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/crm.css" rel="stylesheet">
</head>
<body class="crm-app">
<div id="topnav" data-active="ordini-fornitore.html"></div>
<main class="crm-pagina" id="pagina"></main>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/componenti.js"></script>
<script>
/* Composizione: Intestazione + Stepper + Riepilogo + Tabs
   (Pratica: Pannello Form + Pannello documento | Conferma: idem | Fattura: Pannello Form + DataTable documenti fiscali + Pannello documento |
    Righe: DataTable con totale | Confronto fasi: DataTable a colonne dinamiche) */
const idOrdine = parseInt(new URLSearchParams(location.search).get('id'), 10)
  || parseInt(sessionStorage.getItem('ordineId'), 10);
const ordine = DATA.ordini.find(o => o.id === idOrdine);
const nomeOrdine = o => o.numero_ordine || 'Ordine #' + o.id;

const intestazione = CRM.Intestazione('#pagina', {
  briciole: [{ etichetta: 'Ordini Fornitore', href: 'ordini-fornitore.html' }, { etichetta: ordine ? (ordine.numero_ordine || '#' + ordine.id) : '#' }],
  icona: 'bi-truck', titolo: ordine ? nomeOrdine(ordine) : '', gruppo: true,
  azioni: [
    { etichetta: 'CSV', icona: 'bi-download', variante: 'outline-secondary', piccolo: true, onClick: esportaCSV },
    { etichetta: 'Indietro', icona: 'bi-arrow-left', variante: 'outline-secondary', piccolo: true, href: 'ordini-fornitore.html' }
  ]
});

if (!ordine) {
  CRM.Errore('#pagina', 'Ordine non trovato.');
} else {
  const stepper = CRM.Stepper('#pagina', { passi: [] });
  const riepilogo = CRM.Riepilogo('#pagina', [
    { id: 'fornitore', etichetta: 'Fornitore', icona: 'bi-building' },
    { id: 'cliente', etichetta: 'Cliente', icona: 'bi-person' },
    { id: 'agente', etichetta: 'Agente', icona: 'bi-people' },
    { id: 'importo', etichetta: 'Importo merce', icona: 'bi-cash' },
    { id: 'scadenza', etichetta: 'Scadenza conferma', icona: 'bi-clock' }
  ]);

  const tabs = CRM.Tabs('#pagina', [
    { id: 'pratica', etichetta: 'Pratica', icona: 'bi-clipboard-check' },
    { id: 'conferma', etichetta: 'Conferma', icona: 'bi-check-circle' },
    { id: 'fattura', etichetta: 'Fattura', icona: 'bi-receipt' },
    { id: 'righe', etichetta: 'Righe', icona: 'bi-list-ul' },
    { id: 'confronto', etichetta: 'Confronto fasi', icona: 'bi-bar-chart-steps' }
  ]);

  /* --- Tab Pratica --- */
  const formOrdine = CRM.Form(CRM.Pannello(tabs.pane('pratica'), { titolo: 'Dati pratica', icona: 'bi-clipboard-check' }).corpo, {
    piccolo: true,
    campi: [
      { nome: 'fornitore_id', etichetta: 'Fornitore', tipo: 'select', opzioni: () => CRM.opz.fornitori(), col: 'col-md-6', onChange: calcolaScadenza },
      { nome: 'stato', etichetta: 'Stato', tipo: 'select', col: 'col-md-3', opzioni: [
        { value: 'inviato', label: 'Inviato' }, { value: 'confermato', label: 'Confermato' }, { value: 'fatturato', label: 'Fatturato' }] },
      { nome: 'numero_ordine', etichetta: 'N. Ordine', placeholder: 'OF/2026/041', col: 'col-md-3' },
      { nome: 'data_ordine', etichetta: 'Data Ordine', tipo: 'data', col: 'col-md-4', onChange: calcolaScadenza },
      { nome: 'importo_merce', etichetta: 'Importo Merce €', tipo: 'numero', passo: '0.01', col: 'col-md-4' },
      { nome: 'cliente_piva', etichetta: 'Cliente', tipo: 'select', opzioni: () => CRM.opz.clienti('—'), col: 'col-md-4' },
      { nome: 'agente_id', etichetta: 'Agente', tipo: 'select', opzioni: () => CRM.opz.agenti(), col: 'col-md-6' },
      { nome: 'subagente', etichetta: 'Subagente (da interscambio §7.6)', tipo: 'sola-lettura', col: 'col-md-6' },
      { nome: 'note', etichetta: 'Note', tipo: 'area' }
    ],
    pulsante: { etichetta: 'Salva', icona: 'bi-check-lg', onClick: salvaOrdine }
  });
  const docOrdine = CRM.Pannello(tabs.pane('pratica'), { titolo: 'Documenti — Ordine', icona: 'bi-paperclip' });

  /* --- Tab Conferma --- */
  const formConferma = CRM.Form(CRM.Pannello(tabs.pane('conferma'), { titolo: 'Dati conferma', icona: 'bi-check-circle' }).corpo, {
    piccolo: true,
    campi: [
      { nome: 'conferma_data', etichetta: 'Data Conferma', tipo: 'data', col: 'col-md-4' },
      { nome: 'conferma_numero', etichetta: 'N. Conferma', placeholder: 'C-2026/…', col: 'col-md-4' },
      { nome: 'conferma_scadenza', etichetta: 'Scadenza Conferma', tipo: 'data', col: 'col-md-4' }
    ],
    pulsante: { etichetta: 'Salva Conferma', icona: 'bi-check-lg', variante: 'info text-white', onClick: salvaConferma }
  });
  const docConferma = CRM.Pannello(tabs.pane('conferma'), { titolo: 'Documenti — Conferma', icona: 'bi-paperclip' });

  /* --- Tab Fattura --- */
  const formFattura = CRM.Form(CRM.Pannello(tabs.pane('fattura'), { titolo: 'Dati fattura', icona: 'bi-receipt' }).corpo, {
    piccolo: true,
    campi: [
      { nome: 'fattura_numero', etichetta: 'N. Fattura', placeholder: 'F-2026/…', col: 'col-md-4' },
      { nome: 'fattura_data', etichetta: 'Data Fattura', tipo: 'data', col: 'col-md-4' },
      { nome: 'fattura_importo', etichetta: 'Importo Fattura €', tipo: 'numero', passo: '0.01', col: 'col-md-4' }
    ],
    pulsante: { etichetta: 'Salva Fattura', icona: 'bi-check-lg', variante: 'success', onClick: salvaFattura }
  });
  const tabDocumenti = CRM.DataTable(CRM.blocco(tabs.pane('fattura'), { riempi: true }), {
    titolo: 'Documenti fiscali', icona: 'bi-files', contatore: true, compatta: true,
    colonne: [
      { key: 'tipo', header: 'Tipo', cell: d => {
        const nc = d.tipo === 'nota_credito';
        return '<span class="badge ' + (nc ? 'bg-danger-subtle text-danger' : 'bg-success-subtle text-success') + '">' + (nc ? 'Nota di credito' : 'Fattura') + '</span>' +
          (nc && d.fattura_riferimento ? ' <small class="text-muted">storna ' + CRM.esc(d.fattura_riferimento) + (d.storno_totale ? ' (totale)' : ' (parziale)') + '</small>' : '');
      } },
      { key: 'numero', header: 'Numero' },
      { key: 'data', header: 'Data', tipo: 'data' },
      { key: 'importo', header: 'Importo', tipo: 'euro', classe: d => 'fw-semibold' + (Number(d.importo) < 0 ? ' text-danger' : '') },
      { key: 'att_filename', header: 'Allegato', grow: true, cell: d => d.att_filename ? CRM.docChip(d.att_filename) : '<span class="text-muted small">—</span>' }
    ],
    rowKey: (d, i) => (d.numero || '') + '-' + i,
    emptyText: 'Nessun documento registrato.',
    piede: 'Fatture e note di credito agganciate alla pratica (§4.2.7.1). Il <strong>netto</strong> è la base provvigioni; una nota di credito totale azzera la provvigione sulla fattura stornata.'
  });
  const docFattura = CRM.Pannello(tabs.pane('fattura'), { titolo: 'Documenti — Fattura', icona: 'bi-paperclip' });

  /* --- Tab Righe --- */
  const tabRighe = CRM.DataTable(CRM.blocco(tabs.pane('righe'), { riempi: true }), {
    titolo: 'Righe Ordine', icona: 'bi-list-ul', contatore: true,
    azioniTestata: [{ etichetta: 'Aggiungi', icona: 'bi-plus', onClick: apriModaleRiga }],
    colonne: [
      { key: 'numero_riga', header: '#', tipo: 'numero', align: 'left', width: '56px', classe: 'text-muted small', valore: r => r.numero_riga || r._i + 1 },
      { key: 'codice', header: 'Codice' },
      { key: 'descrizione', header: 'Descrizione', grow: true },
      { key: 'um', header: 'UM' },
      { key: 'quantita', header: 'Q.tà', tipo: 'numero' },
      { key: 'prezzo_unitario', header: 'Prezzo Unit.', tipo: 'euro' },
      { key: 'importo', header: 'Importo', tipo: 'euro', classe: 'fw-semibold', totale: 'somma' }
    ],
    rowKey: r => r._i,
    etichettaTotale: 'Totale merce',
    azioni: [{ icona: 'bi-trash', tooltip: 'Elimina', variante: 'danger', onClick: r => eliminaRiga(r._i) }],
    emptyText: 'Nessuna riga. Aggiungi la prima riga dell\'ordine.'
  });

  /* --- Tab Confronto fasi --- */
  const tabConfronto = CRM.DataTable(CRM.blocco(tabs.pane('confronto'), { riempi: true }), {
    titolo: 'Confronto fasi', icona: 'bi-bar-chart-steps', compatta: true, colonne: [],
    rowKey: r => r.codice, rowClass: r => r.variazione ? 'table-warning' : '',
    emptyText: 'Confronto disponibile da due fasi in poi (ordine → conferma → fattura).',
    piede: 'Righe allineate per <strong>codice</strong> tra ordine, conferma e fattura (§5.8): articoli comparsi/spariti, variazioni di quantità e prezzo. Gli scostamenti alimentano le segnalazioni della dashboard (§5.12).'
  });

  /* ---------- Disegno ---------- */
  function subagentePerOrdine(o) {
    const x = (DATA.interscambio || []).find(it => it.cliente_piva === o.cliente_piva && it.fornitore_id === o.fornitore_id && it.attivo !== false);
    if (!x) return null;
    const sub = (DATA.subagenti || []).find(s => s.id === x.subagente_id);
    return sub ? { subagente: sub.nome + ' ' + sub.cognome, sconto: x.discount } : null;
  }
  function calcolaScadenza() {
    const fid = formOrdine.campo('fornitore_id').value;
    const d = formOrdine.campo('data_ordine').value;
    if (!fid || !d) return;
    const fornitore = DATA.fornitori.find(x => x.id === parseInt(fid, 10));
    if (!fornitore) return;
    const data = new Date(d);
    data.setDate(data.getDate() + (fornitore.giorni_attesa_conferma || 30));
    const scad = data.toISOString().split('T')[0];
    formConferma.imposta({ conferma_scadenza: scad });
    formConferma.aiuto('conferma_scadenza', 'Scadenza auto-calcolata: ' + fmtData(scad) +
      ' (data ordine + ' + (fornitore.giorni_attesa_conferma || 30) + ' giorni attesa ' + CRM.esc(fornitore.ragione_sociale) + ')');
  }
  function renderTitolo() {
    intestazione.aggiorna({ titolo: nomeOrdine(ordine), badge: CRM.badgeStato(ordine.stato),
      sottotitolo: 'Ordine ' + fmtData(ordine.data_ordine) + ' · ' + fornitoreNome(ordine.fornitore_id) + ' · ' + clienteNome(ordine.cliente_piva),
      briciole: [{ etichetta: 'Ordini Fornitore', href: 'ordini-fornitore.html' }, { etichetta: ordine.numero_ordine || '#' + ordine.id }] });
  }
  function renderStepper() {
    const stati = ['inviato', 'confermato', 'fatturato'];
    const etichette = { inviato: 'Inviato', confermato: 'Confermato', fatturato: 'Fatturato' };
    const idx = stati.indexOf(ordine.stato);
    const nNC = documentiOrdine(ordine).filter(d => d.tipo === 'nota_credito').length;
    stepper.aggiorna({
      passi: stati.map((s, i) => ({ etichetta: etichette[s], stato: i < idx ? 'done' : i === idx ? 'active' : '' })).concat([{
        etichetta: 'Nota di credito' + (nNC ? ' (' + nNC + ')' : ''), stato: nNC ? 'done' : '', icona: nNC ? 'bi-check-circle-fill' : 'bi-file-earmark-minus',
        title: 'Documento agganciato alla pratica: riduce l\'imponibile, non cambia lo stato' }]),
      nota: 'La pratica passa da <strong>inviato</strong> a <strong>confermato</strong> all\'arrivo della conferma ordine (§5.4) e a <strong>fatturato</strong> all\'emissione della fattura fornitore; solo le pratiche fatturate entrano in liquidazione e nel confronto bollettini. Le tre fasi corrispondono ai tab sottostanti. La <strong>nota di credito</strong> è l\'ultimo passo del flusso documentale (§6.1) ma <strong>non è uno stato</strong>: è un documento agganciato alla pratica che riduce l\'imponibile (storno parziale) o azzera la provvigione sulla fattura stornata (storno totale).'
    });
  }
  function renderRiepilogo() {
    riepilogo.aggiorna('fornitore', fornitoreNome(ordine.fornitore_id));
    riepilogo.aggiorna('cliente', clienteNome(ordine.cliente_piva));
    const ag = (DATA.agenti || []).find(a => a.id === ordine.agente_id);
    riepilogo.aggiorna('agente', ag ? ag.nome + ' ' + ag.cognome : '');
    riepilogo.aggiorna('importo', fmtEuro(ordine.importo_merce));
    const scad = ordine.conferma_scadenza;
    if (scad) {
      const scaduta = ordine.stato === 'inviato' && scad < OGGI.toISOString().split('T')[0];
      riepilogo.aggiorna('scadenza', fmtData(scad) + (scaduta ? ' (scaduta)' : ''), scaduta ? 'danger' : ordine.stato === 'inviato' ? 'warn' : '');
    } else {
      riepilogo.aggiorna('scadenza', '');
    }
  }
  function renderSchede() {
    const ok = '<i class="bi bi-check-circle-fill text-success ms-1"></i>';
    tabs.badge('conferma', (ordine.conferma_numero || ordine.conferma_data) ? ok : '');
    tabs.badge('fattura', (ordine.fattura_numero || ordine.fattura_data) ? ok : '');
    tabs.badge('righe', CRM.badgeConteggio((ordine.righe || []).length));
  }
  function renderDocumenti() {
    const testo = {
      ordine: 'Allegato dell\'ordine acquisito tramite importazione e validazione della Gestione Ordini (§6.1). Nell\'app l\'upload documentale è attivo qui.',
      conferma: 'Allegato della conferma ordine acquisito tramite importazione e validazione della Gestione Ordini (§6.1). La compilazione porta la pratica da <strong>inviato</strong> a <strong>confermato</strong> (§9).',
      fattura: 'Allegato della fattura fornitore acquisito tramite importazione e validazione della Gestione Ordini (§6.1). La compilazione porta la pratica a <strong>fatturato</strong>: da qui entra nel calcolo provvigioni e nel confronto bollettini (§9–§10).'
    };
    [[docOrdine, 'att_filename_ordine', 'ordine'], [docConferma, 'att_filename_conferma', 'conferma'], [docFattura, 'att_filename_fattura', 'fattura']].forEach(([p, campo, k]) => {
      p.corpo.innerHTML = CRM.docChip(ordine[campo]) + '<div class="form-text small mt-2">' + testo[k] + '</div>';
    });
    tabDocumenti.aggiorna(documentiOrdine(ordine), { testataDestra: '<span class="small text-muted">Netto pratica: <strong>' + fmtEuro(importoNettoOrdine(ordine)) + '</strong></span>' });
  }
  function renderConfronto() {
    const fasi = fasiOrdine(ordine);
    if (fasi.length < 2) {
      tabs.badge('confronto', '');
      tabConfronto.aggiorna([], { testataExtra: '', colonne: [{ key: 'codice', header: 'Codice' }, { key: 'descrizione', header: 'Descrizione' }] });
      return;
    }
    const rows = confrontoFasi(ordine);
    const nVar = rows.filter(r => r.variazione).length;
    tabs.badge('confronto', nVar ? '<span class="badge bg-warning text-dark rounded-pill ms-1">' + nVar + '</span>' : '');
    const colFasi = fasi.map(f => ({
      key: 'fase_' + f.key, header: f.label, align: 'right', sortValue: r => r.fasi[f.key] ? Number(r.fasi[f.key].importo || 0) : -Infinity,
      classe: r => r.fasi[f.key] ? '' : 'text-muted',
      cell: r => { const x = r.fasi[f.key]; return x ? fmtNum(x.quantita, 0) + ' × ' + fmtEuro(x.prezzo_unitario) + '<br><small class="text-muted">' + fmtEuro(x.importo) + '</small>' : 'assente'; }
    }));
    tabConfronto.aggiorna(rows, {
      testataExtra: nVar ? '<span class="badge bg-warning text-dark ms-2">' + nVar + ' variazioni</span>' : '<span class="badge bg-success-subtle text-success ms-2">Nessuna variazione</span>',
      colonne: [{ key: 'codice', header: 'Codice', classe: 'fw-semibold' }, { key: 'descrizione', header: 'Descrizione', grow: true }]
        .concat(colFasi).concat([
          { key: 'delta', header: 'Delta', align: 'right', sortValue: r => r.delta == null ? -Infinity : r.delta,
            cell: r => r.delta == null ? '<span class="text-muted">—</span>'
              : (Math.round(r.delta * 100) === 0 ? '<span class="text-muted">' + fmtEuro(0) + '</span>'
                : '<span class="' + (r.delta < 0 ? 'text-danger' : 'text-success') + ' fw-semibold">' + fmtEuro(r.delta) + '</span>') },
          { key: 'variazione', header: '', sortable: false, width: '40px', cell: r => r.variazione ? '<i class="bi bi-exclamation-triangle text-warning" title="Variazione fra fasi"></i>' : '' }])
    });
  }
  function renderSubagente() {
    const legame = subagentePerOrdine(ordine);
    formOrdine.imposta({ subagente: legame ? legame.subagente + ' — sconto ' + legame.sconto + '%' : '' });
    formOrdine.info(legame
      ? 'Derivato da interscambio (cliente × fornitore). Determina lo scaglione provvigioni (§5.1).'
      : 'Nessun legame in interscambio per questo cliente × fornitore: nessuna provvigione subagente (§7.6).');
  }
  function renderForm() {
    formOrdine.imposta({
      fornitore_id: ordine.fornitore_id, stato: ordine.stato, numero_ordine: ordine.numero_ordine || '',
      data_ordine: ordine.data_ordine || '', importo_merce: ordine.importo_merce || 0,
      cliente_piva: ordine.cliente_piva || '', agente_id: ordine.agente_id, note: ordine.note || ''
    });
    formConferma.imposta({ conferma_data: ordine.conferma_data || '', conferma_numero: ordine.conferma_numero || '', conferma_scadenza: ordine.conferma_scadenza || '' });
    formFattura.imposta({ fattura_numero: ordine.fattura_numero || '', fattura_data: ordine.fattura_data || '', fattura_importo: ordine.fattura_importo || '' });
    calcolaScadenza();
  }
  function renderRighe() {
    tabRighe.aggiorna((ordine.righe || []).map((r, i) => Object.assign({ _i: i }, r)));
  }
  function refresh() {
    renderRiepilogo(); renderSchede(); renderDocumenti(); renderConfronto(); renderSubagente();
  }

  /* ---------- Azioni ---------- */
  function cambiaStato(nuovo) { if (ordine.stato !== nuovo) { ordine.stato = nuovo; renderStepper(); renderTitolo(); } }
  function salvaOrdine(f) {
    delete f.subagente;
    f.fornitore_id = parseInt(f.fornitore_id);
    f.agente_id = parseInt(f.agente_id);
    f.importo_merce = parseFloat(f.importo_merce) || 0;
    const nuovo = f.stato; delete f.stato;
    Object.assign(ordine, f);
    cambiaStato(nuovo);
    renderForm(); refresh();
    showToast('Ordine salvato');
  }
  function salvaConferma(f) {
    Object.assign(ordine, f);
    /* flusso §9: la compilazione della conferma porta la pratica da "inviato" a "confermato" */
    if (ordine.stato === 'inviato' && (ordine.conferma_numero || ordine.conferma_data)) cambiaStato('confermato');
    renderForm(); refresh();
    showToast('Conferma salvata');
  }
  function salvaFattura(f) {
    if (f.fattura_importo) f.fattura_importo = parseFloat(f.fattura_importo);
    Object.assign(ordine, f);
    if (ordine.stato !== 'fatturato' && (ordine.fattura_numero || ordine.fattura_data)) cambiaStato('fatturato');
    renderForm(); refresh();
    showToast('Fattura salvata');
  }
  function apriModaleRiga() {
    CRM.FormModal({
      titolo: 'Nuova Riga',
      campi: [
        { nome: 'numero_riga', etichetta: 'N. Riga', tipo: 'numero', col: 'col-4' },
        { nome: 'codice', etichetta: 'Codice', col: 'col-4' },
        { nome: 'um', etichetta: 'UM', valore: 'pz', col: 'col-4' },
        { nome: 'descrizione', etichetta: 'Descrizione' },
        { nome: 'quantita', etichetta: 'Q.tà', tipo: 'numero', passo: '0.01', valore: 0, col: 'col-4' },
        { nome: 'prezzo_unitario', etichetta: 'Prezzo Unit.', tipo: 'numero', passo: '0.01', valore: 0, col: 'col-4' },
        { nome: 'importo', etichetta: 'Importo', tipo: 'numero', passo: '0.01', valore: 0, col: 'col-4' }
      ],
      onConferma: function (f) {
        if (!f.descrizione) { showToast('La descrizione è obbligatoria', false); return false; }
        f.quantita = parseFloat(f.quantita) || 0;
        f.prezzo_unitario = parseFloat(f.prezzo_unitario) || 0;
        f.importo = parseFloat(f.importo) || 0;
        if (!ordine.righe) ordine.righe = [];
        if (!f.numero_riga) f.numero_riga = ordine.righe.length + 1;
        ordine.righe.push(f);
        ordine.importo_merce = ordine.righe.reduce((s, r) => s + Number(r.importo || 0), 0);
        formOrdine.imposta({ importo_merce: ordine.importo_merce });
        renderRighe(); renderRiepilogo(); renderSchede();
        showToast('Riga aggiunta');
      }
    });
  }
  function eliminaRiga(i) {
    if (!conferma('Eliminare questa riga?')) return;
    ordine.righe.splice(i, 1);
    ordine.importo_merce = ordine.righe.reduce((s, r) => s + Number(r.importo || 0), 0);
    formOrdine.imposta({ importo_merce: ordine.importo_merce });
    renderRighe(); renderRiepilogo(); renderSchede();
  }

  renderTitolo(); renderStepper(); renderForm(); renderRighe(); refresh();
}

function esportaCSV() {
  if (!ordine || !ordine.righe || !ordine.righe.length) return showToast('Nessuna riga da esportare', false);
  const header = 'Riga;Codice;Descrizione;UM;Quantita;Prezzo;Importo';
  const rows = ordine.righe.map(r => [r.numero_riga, r.codice, r.descrizione, r.um, r.quantita, r.prezzo_unitario, r.importo]);
  exportCSV('righe_ordine_' + (ordine.numero_ordine || ordine.id) + '.csv', header, rows);
  showToast('CSV esportato');
}
</script>
