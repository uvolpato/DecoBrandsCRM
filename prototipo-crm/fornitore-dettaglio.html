<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dettaglio Fornitore - CRM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/crm.css" rel="stylesheet">
</head>
<body class="crm-app">
<div id="topnav" data-active="fornitori.html"></div>
<main class="crm-pagina" id="pagina"></main>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/componenti.js"></script>
<script>
/* Composizione: Intestazione + griglia 2 colonne (Pannello con Form | DataTable scaglioni) */
const idFornitore = parseInt(new URLSearchParams(location.search).get('id'), 10);
const fornitore = DATA.fornitori.find(f => f.id === idFornitore);

const intestazione = CRM.Intestazione('#pagina', {
  briciole: [{ etichetta: 'Fornitori', href: 'fornitori.html' }, { etichetta: fornitore ? fornitore.ragione_sociale : '#' }],
  titolo: fornitore ? fornitore.ragione_sociale : '', icona: 'bi-building'
});

if (!fornitore) {
  CRM.Errore('#pagina', 'Fornitore non trovato.');
} else {
  const griglia = CRM.blocco('#pagina', { riempi: true, griglia: 2 });

  /* Colonna sinistra: anagrafica */
  const pannello = CRM.Pannello(CRM.blocco(griglia), { titolo: 'Anagrafica', riempi: true });
  const form = CRM.Form(pannello.corpo, {
    campi: [
      { nome: 'ragione_sociale', etichetta: 'Ragione Sociale', col: 'col-md-8' },
      { nome: 'piva', etichetta: 'P.IVA', col: 'col-md-4' },
      { nome: 'giorni_attesa_conferma', etichetta: 'Giorni attesa conferma', tipo: 'numero', col: 'col-md-6' },
      { nome: 'payment_type', etichetta: 'Pagamento provvigioni', tipo: 'select', opzioni: CRM.opz.pagamento, col: 'col-md-6' },
      { nome: 'attivo', etichetta: 'Stato', tipo: 'select', opzioni: CRM.opz.attivo },
      { nome: 'note', etichetta: 'Note', tipo: 'area' }
    ],
    valori: Object.assign({}, fornitore, { giorni_attesa_conferma: fornitore.giorni_attesa_conferma || 30, payment_type: fornitore.payment_type || 'matured' }),
    pulsante: { etichetta: 'Salva', onClick: salvaAnagrafica }
  });

  /* Colonna destra: scaglioni */
  const colDestra = CRM.blocco(griglia);
  const tabScaglioni = CRM.DataTable(CRM.blocco(colDestra, { riempi: true }), {
    titolo: 'Scaglioni Provvigioni',
    azioniTestata: [{ etichetta: 'Aggiungi', icona: 'bi-plus', onClick: apriModaleScaglione }],
    colonne: [
      { key: 'sconto_min', header: 'Sconto Min', tipo: 'numero', align: 'left', cell: s => '&ge; ' + fmtNum(s.sconto_min, 1) + '%' },
      { key: 'sconto_max', header: 'Sconto Max', tipo: 'numero', align: 'left', cell: s => '&le; ' + fmtNum(s.sconto_max, 1) + '%' },
      { key: 'pct_agente', header: '% Agente', tipo: 'pct', align: 'center' },
      { key: 'pct_subagente', header: '% Subagente', tipo: 'pct', align: 'center' }
    ],
    azioni: [{ icona: 'bi-trash', tooltip: 'Elimina', variante: 'danger', onClick: s => eliminaScaglione(s.id) }],
    ordinamentoIniziale: { key: 'sconto_min', dir: 'asc' },
    emptyText: 'Nessuno scaglione definito',
    piede: 'Gli scaglioni sono bucket discreti di sconto (§4.4, §5.11): lo sconto negoziato per l\'associazione cliente-fornitore (interscambio) seleziona la % agente / % subagente corrispondente.'
  });

  function scaglioni() { return DATA.scaglioni.filter(s => s.fornitore_id === fornitore.id); }
  function renderHeader() {
    intestazione.aggiorna({ titolo: fornitore.ragione_sociale, destra: CRM.badgeStato(fornitore.attivo ? 'attivo' : 'inattivo', fornitore.attivo ? 'Attivo' : 'Inattivo'),
      briciole: [{ etichetta: 'Fornitori', href: 'fornitori.html' }, { etichetta: fornitore.ragione_sociale }] });
  }
  function apriModaleScaglione() {
    CRM.FormModal({
      titolo: 'Nuovo Scaglione',
      campi: [
        { nome: 'sconto_min', etichetta: 'Sconto Min %', tipo: 'numero', passo: '0.1', col: 'col-6' },
        { nome: 'sconto_max', etichetta: 'Sconto Max %', tipo: 'numero', passo: '0.1', col: 'col-6' },
        { nome: 'pct_agente', etichetta: '% Agente', tipo: 'numero', passo: '0.01', col: 'col-6' },
        { nome: 'pct_subagente', etichetta: '% Subagente', tipo: 'numero', passo: '0.01', col: 'col-6' }
      ],
      onConferma: function (f) {
        if (f.sconto_min === '' || f.sconto_max === '' || f.pct_agente === '' || f.pct_subagente === '') { showToast('Compila tutti i campi', false); return false; }
        DATA.scaglioni.push({
          id: CRM.nuovoId(DATA.scaglioni), fornitore_id: fornitore.id,
          sconto_min: parseFloat(f.sconto_min), sconto_max: parseFloat(f.sconto_max),
          pct_agente: parseFloat(f.pct_agente), pct_subagente: parseFloat(f.pct_subagente),
          ordinamento: scaglioni().length + 1
        });
        tabScaglioni.aggiorna(scaglioni());
        showToast('Scaglione aggiunto');
      }
    });
  }
  function eliminaScaglione(id) {
    if (!conferma('Eliminare questo scaglione?')) return;
    const i = DATA.scaglioni.findIndex(s => s.id === id);
    if (i >= 0) DATA.scaglioni.splice(i, 1);
    tabScaglioni.aggiorna(scaglioni());
  }
  function salvaAnagrafica(f) {
    f.attivo = f.attivo === 'true';
    Object.assign(fornitore, f);
    renderHeader();
    showToast('Salvato');
  }

  renderHeader();
  tabScaglioni.aggiorna(scaglioni());
}
</script>
</body>
</html>
