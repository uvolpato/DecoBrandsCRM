<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard - CRM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/crm.css" rel="stylesheet">
</head>
<body class="crm-app">
<div id="topnav" data-active="dashboard.html"></div>
<main class="crm-pagina" id="pagina"></main>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/componenti.js"></script>
<script>
/* Composizione: Intestazione + KpiRow + Tabs (griglia di 3 DataTable segnalazioni | DataTable ultimi ordini) */
const q = trimestreCorrente();
const anno = OGGI.getFullYear();
const oggi = OGGI.toISOString().split('T')[0];

function scadenzaOrdine(o) {
  if (o.conferma_scadenza) return o.conferma_scadenza;
  const f = DATA.fornitori.find(x => x.id === o.fornitore_id);
  const d = new Date(o.data_ordine);
  d.setDate(d.getDate() + (f ? (f.giorni_attesa_conferma || 30) : 30));
  return d.toISOString().split('T')[0];
}

CRM.Intestazione('#pagina', {
  titolo: 'Dashboard', icona: 'bi-speedometer2',
  sottotitolo: 'Panoramica delle pratiche, delle segnalazioni e delle provvigioni del periodo',
  destra: '<span class="badge bg-white text-dark border px-3 py-2 fw-semibold"><i class="bi bi-calendar3 me-1"></i>' + trimestreLabel(q) + ' ' + anno + '</span>'
});

const kpi = CRM.KpiRow('#pagina', [
  { id: 'inviati', etichetta: 'Ordini Inviati', variante: 'warning' },
  { id: 'confermati', etichetta: 'Ordini Confermati', variante: 'info' },
  { id: 'fatturati', etichetta: 'Ordini Fatturati', variante: 'success' },
  { id: 'merce', etichetta: 'Merce Q' + q }
]);

const tabs = CRM.Tabs('#pagina', [
  { id: 'segnalazioni', etichetta: 'Segnalazioni', icona: 'bi-bell' },
  { id: 'ordini', etichetta: 'Ordini fornitore', icona: 'bi-truck' }
]);

const griglia = CRM.blocco(tabs.pane('segnalazioni'), { riempi: true, griglia: 3 });
const colOrdine = { key: 'numero_ordine', header: 'Ordine', classe: 'fw-semibold', valore: o => o.numero_ordine || 'Ordine #' + o.id };
const colFornitore = { key: 'fornitore', header: 'Fornitore', valore: o => fornitoreNome(o.fornitore_id) };

const tabScadute = CRM.DataTable(CRM.blocco(griglia), {
  titolo: 'Conferme scadute', icona: 'bi-exclamation-triangle text-danger', contatore: true, classeContatore: 'bg-danger',
  linkTestata: { href: 'ordini-fornitore.html', etichetta: 'Vedi tutti' }, compatta: true,
  colonne: [colOrdine, colFornitore,
    { key: 'scadenza', header: 'Scadenza', tipo: 'data', valore: scadenzaOrdine, classe: 'text-danger' }],
  ordinamentoIniziale: { key: 'scadenza', dir: 'asc' },
  onRowClick: o => CRM.apriOrdine(o.id),
  emptyText: 'Nessuna conferma scaduta'
});

const tabBollettini = CRM.DataTable(CRM.blocco(griglia), {
  titolo: 'Bollettini da verificare', icona: 'bi-receipt text-warning', contatore: true, classeContatore: 'bg-warning text-dark',
  linkTestata: { href: 'bollettini.html', etichetta: 'Vedi tutti' }, compatta: true,
  colonne: [
    { key: 'fornitore', header: 'Fornitore', classe: 'fw-semibold', valore: b => fornitoreNome(b.fornitore_id) },
    { key: 'periodo', header: 'Periodo', sortValue: b => b.anno * 100 + b.mese, cell: b => meseLabel(b.mese) + ' ' + b.anno },
    { key: 'stato', header: 'Stato', tipo: 'stato' }],
  onRowClick: b => CRM.apriBollettino(b.id),
  emptyText: 'Nessun bollettino in attesa'
});

const tabVariazioni = CRM.DataTable(CRM.blocco(griglia), {
  titolo: 'Variazioni fra fasi e note di credito', icona: 'bi-bar-chart-steps text-info', contatore: true, classeContatore: 'bg-info text-dark',
  linkTestata: { href: 'ordini-fornitore.html', etichetta: 'Vedi tutti' }, compatta: true,
  colonne: [colOrdine, colFornitore,
    { key: 'tipo', header: 'Segnalazione', sortValue: o => (haVariazioni(o) ? 'a' : 'b') + (haNotaCredito(o) ? 'a' : 'b'),
      cell: o => (haVariazioni(o) ? '<span class="badge bg-warning text-dark">Var. fasi</span> ' : '') + (haNotaCredito(o) ? '<span class="badge bg-danger">Nota credito</span>' : '') }],
  onRowClick: o => CRM.apriOrdine(o.id),
  emptyText: 'Nessuna variazione o nota di credito'
});

const tabUltimi = CRM.DataTable(CRM.blocco(tabs.pane('ordini'), { riempi: true }), {
  titolo: 'Ultimi ordini', icona: 'bi-clock-history',
  linkTestata: { href: 'ordini-fornitore.html', etichetta: 'Vedi tutti' },
  colonne: [
    { key: 'numero_ordine', header: 'Ordine', classe: 'fw-semibold', valore: o => o.numero_ordine || '#' + o.id },
    colFornitore,
    { key: 'cliente', header: 'Cliente', grow: true, valore: o => clienteNome(o.cliente_piva) },
    { key: 'importo_merce', header: 'Importo', tipo: 'euro' },
    { key: 'stato', header: 'Stato', tipo: 'stato' }],
  onRowClick: o => CRM.apriOrdine(o.id),
  emptyText: 'Nessun ordine'
});

function render() {
  kpi.aggiorna('inviati', DATA.ordini.filter(o => o.stato === 'inviato').length);
  kpi.aggiorna('confermati', DATA.ordini.filter(o => o.stato === 'confermato').length);
  kpi.aggiorna('fatturati', DATA.ordini.filter(o => o.stato === 'fatturato').length);
  kpi.aggiorna('merce', fmtEuro0(DATA.ordini.filter(o => inTrimestre(o.data_ordine, q, anno)).reduce((s, o) => s + Number(o.importo_merce || 0), 0)));

  const scadute = DATA.ordini.filter(o => o.stato === 'inviato' && scadenzaOrdine(o) < oggi);
  const bollettini = DATA.bollettini.filter(b => b.stato === 'da_verificare');
  const variazioni = DATA.ordini.filter(o => haVariazioni(o) || haNotaCredito(o));
  const ultimi = DATA.ordini.slice().sort((a, b) => b.data_ordine.localeCompare(a.data_ordine)).slice(0, 5);

  tabScadute.aggiorna(scadute);
  tabBollettini.aggiorna(bollettini);
  tabVariazioni.aggiorna(variazioni);
  tabUltimi.aggiorna(ultimi);
  tabs.badge('segnalazioni', CRM.badgeConteggio(scadute.length + bollettini.length + variazioni.length, 'bg-danger'));
  tabs.badge('ordini', CRM.badgeConteggio(ultimi.length));
}

render();
</script>
</body>
</html>
