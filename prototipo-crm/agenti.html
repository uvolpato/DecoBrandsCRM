<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Agenti - CRM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/crm.css" rel="stylesheet">
</head>
<body class="crm-app">
<div id="topnav" data-active="agenti.html"></div>
<main class="crm-pagina" id="pagina"></main>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/componenti.js"></script>
<script>
/* Composizione: Intestazione + Tabs (DataTable agenti / DataTable subagenti) + Nota */
CRM.Intestazione('#pagina', {
  titolo: 'Agenti', icona: 'bi-people',
  azioni: [{ etichetta: 'Nuovo Agente', icona: 'bi-plus-lg', onClick: apriModaleNuovoAgente }]
});

const tabs = CRM.Tabs('#pagina', [
  { id: 'agenti', etichetta: 'Agenti' },
  { id: 'subagenti', etichetta: 'Subagenti' }
]);

const tabAgenti = CRM.DataTable(CRM.blocco(tabs.pane('agenti'), { riempi: true }), {
  colonne: [
    { key: 'codice', header: 'Codice', classe: 'text-muted' },
    { key: 'cognome', header: 'Cognome', classe: 'fw-semibold' },
    { key: 'nome', header: 'Nome' },
    { key: 'email', header: 'Email', grow: true },
    { key: 'telefono', header: 'Telefono' },
    { key: 'nsub', header: 'Subagenti', tipo: 'conteggio', valore: a => DATA.subagenti.filter(s => s.agente_id === a.id).length },
    { key: 'attivo', header: 'Stato', sortValue: a => a.attivo ? 0 : 1, cell: a => CRM.badgeAttivo(a.attivo) }
  ],
  azioni: [{ icona: 'bi-pencil', tooltip: 'Modifica', onClick: a => modificaAgente(a.id) }],
  emptyText: 'Nessun agente'
});

const tabSub = CRM.DataTable(CRM.blocco(tabs.pane('subagenti'), { riempi: true }), {
  titolo: 'Subagenti',
  azioniTestata: [{ etichetta: 'Nuovo Subagente', icona: 'bi-plus', onClick: apriModaleNuovoSubagente }],
  colonne: [
    { key: 'codice', header: 'Codice', classe: 'text-muted' },
    { key: 'cognome', header: 'Cognome', classe: 'fw-semibold' },
    { key: 'nome', header: 'Nome' },
    { key: 'agente', header: 'Agente', valore: s => agenteNome(s.agente_id) },
    { key: 'email', header: 'Email', grow: true },
    { key: 'attivo', header: 'Stato', sortValue: s => s.attivo ? 0 : 1, cell: s => CRM.badgeAttivo(s.attivo) }
  ],
  azioni: [{ icona: 'bi-pencil', tooltip: 'Modifica', onClick: s => modificaSubagente(s.id) }],
  emptyText: 'Nessun subagente'
});

CRM.Nota('#pagina',
  '<strong>Scenario reale (§4.2.1):</strong> agente unico <strong>Decobrands SRL</strong>; ' +
  'Schwarzmeier e Monzani non risultano più agenti attivi (provvigione al 31/12/2024). ' +
  'I subagenti (Bastasin, Nista, Ravelli, Pontoglio) fanno capo tutti a Decobrands SRL.');

function render() {
  tabs.badge('agenti', '(' + DATA.agenti.length + ')');
  tabs.badge('subagenti', '(' + DATA.subagenti.length + ')');
  tabAgenti.aggiorna(DATA.agenti);
  tabSub.aggiorna(DATA.subagenti);
}

const campiAnagrafica = [
  { nome: 'nome', etichetta: 'Nome', col: 'col-md-6' },
  { nome: 'cognome', etichetta: 'Cognome', col: 'col-md-6' },
  { nome: 'email', etichetta: 'Email', tipo: 'email', col: 'col-md-6' }
];

function apriModaleNuovoAgente() {
  CRM.FormModal({
    titolo: 'Nuovo Agente',
    campi: [
      { nome: 'codice', etichetta: 'Codice', obbligatorio: true, col: 'col-md-4' },
      { nome: 'nome', etichetta: 'Nome', obbligatorio: true, col: 'col-md-4' },
      { nome: 'cognome', etichetta: 'Cognome', obbligatorio: true, col: 'col-md-4' },
      { nome: 'email', etichetta: 'Email', tipo: 'email', col: 'col-md-6' },
      { nome: 'telefono', etichetta: 'Telefono', col: 'col-md-6' }
    ],
    onConferma: function (f) {
      if (!f.codice || !f.nome || !f.cognome) { showToast('Compila tutti i campi obbligatori', false); return false; }
      DATA.agenti.push(Object.assign({ id: CRM.nuovoId(DATA.agenti), attivo: true }, f));
      render(); showToast('Agente creato');
    }
  });
}
function apriModaleNuovoSubagente() {
  CRM.FormModal({
    titolo: 'Nuovo Subagente',
    campi: [
      { nome: 'agente_id', etichetta: 'Agente', obbligatorio: true, tipo: 'select', opzioni: () => CRM.opz.agenti('Seleziona...', true), col: 'col-md-6' },
      { nome: 'codice', etichetta: 'Codice', obbligatorio: true, col: 'col-md-6' },
      { nome: 'nome', etichetta: 'Nome', obbligatorio: true, col: 'col-md-6' },
      { nome: 'cognome', etichetta: 'Cognome', obbligatorio: true, col: 'col-md-6' },
      { nome: 'email', etichetta: 'Email', tipo: 'email' }
    ],
    onConferma: function (f) {
      if (!f.agente_id || !f.codice || !f.nome || !f.cognome) { showToast('Compila tutti i campi obbligatori', false); return false; }
      DATA.subagenti.push(Object.assign({ id: CRM.nuovoId(DATA.subagenti), attivo: true }, f, { agente_id: parseInt(f.agente_id) }));
      render(); showToast('Subagente creato');
    }
  });
}
function modificaAgente(id) {
  const a = DATA.agenti.find(x => x.id === id);
  CRM.FormModal({
    titolo: 'Modifica Agente',
    campi: campiAnagrafica.concat([
      { nome: 'telefono', etichetta: 'Telefono', col: 'col-md-6' },
      { nome: 'attivo', etichetta: 'Stato', tipo: 'select', opzioni: CRM.opz.attivo, col: 'col-md-6' }]),
    valori: a,
    onConferma: function (f) {
      a.nome = f.nome; a.cognome = f.cognome; a.email = f.email; a.telefono = f.telefono; a.attivo = f.attivo === 'true';
      render(); showToast('Agente salvato');
    }
  });
}
function modificaSubagente(id) {
  const s = DATA.subagenti.find(x => x.id === id);
  CRM.FormModal({
    titolo: 'Modifica Subagente',
    campi: campiAnagrafica.concat([{ nome: 'attivo', etichetta: 'Stato', tipo: 'select', opzioni: CRM.opz.attivo, col: 'col-md-6' }]),
    valori: s,
    onConferma: function (f) {
      s.nome = f.nome; s.cognome = f.cognome; s.email = f.email; s.attivo = f.attivo === 'true';
      render(); showToast('Subagente salvato');
    }
  });
}

render();
</script>
</body>
</html>
