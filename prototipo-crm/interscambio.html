<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Interscambio - CRM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/crm.css" rel="stylesheet">
</head>
<body class="crm-app">
<div id="topnav" data-active="interscambio.html"></div>
<main class="crm-pagina" id="pagina"></main>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/componenti.js"></script>
<script>
/* Composizione: Intestazione + DataTable + Nota */
CRM.Intestazione('#pagina', {
  titolo: 'Interscambio Agenti-Clienti-Fornitori', icona: 'bi-arrow-left-right',
  sottotitolo: 'Definisce quale subagente segue quale cliente per quale fornitore nella determinazione delle provvigioni (§5.7, §5.10).',
  azioni: [{ etichetta: 'Nuova Associazione', icona: 'bi-plus-lg', onClick: apriModaleNuovo }]
});

function nomi(x) {
  const s = DATA.subagenti.find(v => v.id === x.subagente_id);
  if (!s) return { agente: '—', subagente: '—' };
  const a = DATA.agenti.find(v => v.id === s.agente_id);
  return { agente: a ? a.nome + ' ' + a.cognome : '—', subagente: s.nome + ' ' + s.cognome };
}

const tabella = CRM.DataTable(CRM.blocco('#pagina', { riempi: true }), {
  colonne: [
    { key: 'agente', header: 'Agente', valore: x => nomi(x).agente },
    { key: 'subagente', header: 'Subagente', valore: x => nomi(x).subagente, classe: 'fw-semibold' },
    { key: 'cliente', header: 'Cliente (P.IVA)', grow: true, valore: x => clienteNome(x.cliente_piva),
      cell: x => CRM.esc(clienteNome(x.cliente_piva)) + ' <br><small class="text-muted">' + CRM.esc(x.cliente_piva) + '</small>' },
    { key: 'fornitore', header: 'Fornitore', valore: x => fornitoreNome(x.fornitore_id) },
    { key: 'codice_cliente_fornitore', header: 'Cod. cliente fornitore',
      cell: x => x.codice_cliente_fornitore
        ? '<span class="badge bg-light text-secondary border">' + CRM.esc(x.codice_cliente_fornitore) + '</span>'
        : '<span class="text-muted small" title="Senza codice l\'abbinamento dei documenti resta manuale (§4.4)">n/d</span>' },
    { key: 'discount', header: 'Sconto %', tipo: 'numero', align: 'center',
      cell: x => {
        const sc = scaglionePerSconto(x.fornitore_id, x.discount);
        return fmtNum(x.discount, 1) + '%' + (sc ? ' <span class="badge bg-light text-secondary" title="Scaglione ' + fmtNum(sc.pct_agente, 2) + '% agente / ' + fmtNum(sc.pct_subagente, 2) + '% subagente">→ ' + fmtNum(sc.pct_agente, 1) + '/' + fmtNum(sc.pct_subagente, 1) + '%</span>' : '');
      } }
  ],
  righe: DATA.interscambio,
  azioni: [{ icona: 'bi-trash', tooltip: 'Elimina', variante: 'danger', onClick: x => elimina(x.id) }],
  emptyText: 'Nessuna associazione definita'
});

CRM.Nota('#pagina',
  '<strong>Sconto %</strong> = percentuale di sconto negoziata per l\'associazione (campo previsto dalla specifica §4.4; ' +
  'mancante in <code>init.js</code>, segnalato come gap). Seleziona lo scaglione provvigioni del fornitore (§10).<br>' +
  '<strong>Codice cliente del fornitore</strong> = come il fornitore chiama quel cliente su conferma e fattura (facoltativo, univoco per fornitore). ' +
  'È la chiave con cui, all\'arrivo del documento, il sistema riconosce la pratica (§4.4); senza codice l\'abbinamento resta manuale.');

const AIUTO_SCONTO = 'Deve corrispondere a uno scaglione del fornitore, altrimenti viene usato il bucket di coda.';
function suggerimentoScaglione(form) {
  const fid = parseInt(form.campo('fornitore_id').value, 10);
  const d = parseFloat(form.campo('discount').value);
  if (!fid || isNaN(d)) return form.aiuto('discount', AIUTO_SCONTO);
  const sc = scaglionePerSconto(fid, d);
  form.aiuto('discount', sc ? (sc.pct_agente === 0 ? 'Scaglione a provvigione azzerata (§5.11: ' + fmtNum(sc.sconto_min, 1) + '–' + fmtNum(sc.sconto_max, 1) + '%).' :
      'Scaglione ' + fmtNum(sc.sconto_min, 1) + '–' + fmtNum(sc.sconto_max, 1) + '% → agente ' + fmtNum(sc.pct_agente, 2) + '%, subagente ' + fmtNum(sc.pct_subagente, 2) + '%.')
    : 'Nessuno scaglione compatibile.');
}

function apriModaleNuovo() {
  CRM.FormModal({
    titolo: 'Nuova Associazione',
    campi: [
      { nome: 'subagente_id', etichetta: 'Subagente', obbligatorio: true, tipo: 'select',
        opzioni: () => [{ value: '', label: 'Seleziona subagente...' }].concat(DATA.subagenti.map(s => { const a = DATA.agenti.find(v => v.id === s.agente_id); return { value: s.id, label: (a ? a.nome + ' — ' : '') + s.nome + ' ' + s.cognome }; })) },
      { nome: 'cliente_piva', etichetta: 'Cliente', obbligatorio: true, tipo: 'select', opzioni: () => CRM.opz.clienti('Seleziona cliente...', true) },
      { nome: 'fornitore_id', etichetta: 'Fornitore', obbligatorio: true, tipo: 'select', opzioni: () => CRM.opz.fornitori('Seleziona fornitore...'), onChange: suggerimentoScaglione },
      { nome: 'codice_cliente_fornitore', etichetta: 'Codice cliente del fornitore', placeholder: 'es. GA-2271',
        aiuto: 'Come compare stampato dal fornitore su conferma e fattura: in arrivo documento il sistema lo usa per abbinare la pratica al cliente (§4.4). Facoltativo.' },
      { nome: 'discount', etichetta: 'Sconto %', obbligatorio: true, tipo: 'numero', passo: '0.1', min: 0, valore: 0, aiuto: AIUTO_SCONTO, onChange: suggerimentoScaglione }
    ],
    onConferma: function (f) {
      if (!f.subagente_id || !f.cliente_piva || !f.fornitore_id) { showToast('Compila tutti i campi', false); return false; }
      const fid = parseInt(f.fornitore_id, 10);
      const codice = (f.codice_cliente_fornitore || '').trim();
      if (DATA.interscambio.find(x => x.cliente_piva === f.cliente_piva && x.fornitore_id === fid)) {
        showToast('Vincolo UNIQUE §5.10: esiste già una associazione per cliente × fornitore', false); return false;
      }
      if (codice && DATA.interscambio.find(x => x.fornitore_id === fid && (x.codice_cliente_fornitore || '').toUpperCase() === codice.toUpperCase())) {
        showToast('Codice già assegnato a un altro cliente di ' + fornitoreNome(fid), false); return false;
      }
      DATA.interscambio.push({
        id: CRM.nuovoId(DATA.interscambio),
        subagente_id: parseInt(f.subagente_id), cliente_piva: f.cliente_piva,
        fornitore_id: fid, codice_cliente_fornitore: codice || null,
        discount: parseFloat(f.discount) || 0, attivo: true
      });
      showToast('Associazione creata');
      tabella.aggiorna(DATA.interscambio);
    }
  });
}
function elimina(id) {
  if (!conferma('Eliminare questa associazione?')) return;
  const i = DATA.interscambio.findIndex(x => x.id === id);
  if (i >= 0) DATA.interscambio.splice(i, 1);
  tabella.aggiorna(DATA.interscambio);
}
</script>
</body>
</html>
