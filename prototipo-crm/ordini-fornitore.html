<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ordini Fornitore - CRM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/crm.css" rel="stylesheet">
</head>
<body class="crm-app">
<div id="topnav" data-active="ordini-fornitore.html"></div>
<main class="crm-pagina" id="pagina"></main>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/componenti.js"></script>
<script>
/* Composizione: Intestazione + FilterBar + DataTable */
CRM.Intestazione('#pagina', {
  titolo: 'Ordini Fornitore', icona: 'bi-truck',
  azioni: [{ etichetta: 'Nuovo Ordine', icona: 'bi-plus-lg', onClick: apriModaleNuovo }]
});

const filtri = CRM.FilterBar('#pagina', {
  card: false,
  campi: [
    { nome: 'stato', tipo: 'select', col: 'col-auto', opzioni: [
      { value: '', label: 'Tutti gli stati' }, { value: 'inviato', label: 'Inviato' },
      { value: 'confermato', label: 'Confermato' }, { value: 'fatturato', label: 'Fatturato' }] },
    { nome: 'q', tipo: 'cerca', placeholder: 'Cerca ordine, cliente, fornitore...' }
  ],
  onChange: render
});

function segnalazioni(o) {
  const s = [];
  if (haVariazioni(o)) s.push('<i class="bi bi-exclamation-triangle text-warning" title="Variazioni di composizione fra fasi (§5.8)"></i>');
  if (haNotaCredito(o)) s.push('<i class="bi bi-file-earmark-minus text-danger" title="Nota di credito in aggancio (§5.3)"></i>');
  return s.length ? ' ' + s.join(' ') : '';
}

const tabella = CRM.DataTable(CRM.blocco('#pagina', { riempi: true }), {
  colonne: [
    { key: 'id', header: '#', tipo: 'numero', align: 'left', width: '56px', classe: 'text-muted small' },
    { key: 'numero_ordine', header: 'Ordine',
      cell: o => '<a href="ordine-fornitore-dettaglio.html?id=' + o.id + '" onclick="sessionStorage.setItem(\'ordineId\',' + o.id + ')" class="text-decoration-none fw-semibold">' + CRM.esc(o.numero_ordine || '—') + '</a>' + segnalazioni(o) },
    { key: 'data_ordine', header: 'Data', tipo: 'data' },
    { key: 'fornitore', header: 'Fornitore', valore: o => fornitoreNome(o.fornitore_id) },
    { key: 'cliente', header: 'Cliente', valore: o => clienteNome(o.cliente_piva), grow: true },
    { key: 'importo_merce', header: 'Importo', tipo: 'euro' },
    { key: 'righe', header: 'Righe', tipo: 'conteggio', valore: o => (o.righe || []).length },
    { key: 'stato', header: 'Stato', tipo: 'stato' }
  ],
  azioni: [
    { icona: 'bi-eye', tooltip: 'Dettaglio', onClick: o => CRM.apriOrdine(o.id) },
    { icona: 'bi-trash', tooltip: 'Elimina', variante: 'danger', onClick: o => elimina(o.id) }
  ],
  onRowClick: o => CRM.apriOrdine(o.id),
  emptyText: 'Nessun ordine trovato'
});

function render() {
  const f = filtri.valori();
  tabella.aggiorna(DATA.ordini.filter(o =>
    (!f.stato || o.stato === f.stato) &&
    CRM.corrisponde(f.q, [o.numero_ordine, clienteNome(o.cliente_piva), fornitoreNome(o.fornitore_id)])));
}

function apriModaleNuovo() {
  CRM.FormModal({
    titolo: 'Nuovo Ordine Fornitore', dimensione: 'lg', conferma: 'Crea',
    campi: [
      { nome: 'fornitore_id', etichetta: 'Fornitore', obbligatorio: true, tipo: 'select', opzioni: () => CRM.opz.fornitori('Seleziona...'), col: 'col-md-6' },
      { nome: 'numero_ordine', etichetta: 'N. Ordine', placeholder: 'OF/2026/0xx', col: 'col-md-3' },
      { nome: 'data_ordine', etichetta: 'Data Ordine', tipo: 'data', col: 'col-md-3' },
      { nome: 'cliente_piva', etichetta: 'Cliente', tipo: 'select', opzioni: () => CRM.opz.clienti('Seleziona cliente...'), col: 'col-md-6' },
      { nome: 'importo_merce', etichetta: 'Importo Merce €', tipo: 'numero', passo: '0.01', col: 'col-md-6' },
      { nome: 'note', etichetta: 'Note', tipo: 'area' }
    ],
    onConferma: function (f) {
      if (!f.fornitore_id) { showToast('Seleziona un fornitore', false); return false; }
      DATA.ordini.push({
        id: CRM.nuovoId(DATA.ordini), fornitore_id: parseInt(f.fornitore_id), numero_ordine: f.numero_ordine,
        data_ordine: f.data_ordine || new Date().toISOString().split('T')[0],
        cliente_piva: f.cliente_piva, agente_id: 1,
        importo_merce: f.importo_merce ? parseFloat(f.importo_merce) : 0,
        stato: 'inviato', note: f.note || '', righe: []
      });
      showToast('Ordine creato');
      render();
    }
  });
}

function elimina(id) {
  if (!conferma('Eliminare questo ordine?')) return;
  const i = DATA.ordini.findIndex(o => o.id === id);
  if (i >= 0) DATA.ordini.splice(i, 1);
  render();
}

render();
</script>
</body>
</html>
