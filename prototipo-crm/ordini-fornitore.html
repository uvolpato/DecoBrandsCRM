<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ordini Fornitore - CRM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/crm.css" rel="stylesheet">
</head>
<body>
<div id="topnav" data-active="ordini-fornitore.html"></div>
<div class="container-fluid px-3 px-md-4 py-4">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="mb-0"><i class="bi bi-truck me-2"></i>Ordini Fornitore</h4>
    <button class="btn btn-primary" onclick="apriModaleNuovo()">
      <i class="bi bi-plus-lg me-1"></i>Nuovo Ordine
    </button>
  </div>

  <!-- Filtri -->
  <form class="row g-2 mb-3" onsubmit="event.preventDefault(); renderTabelle();">
    <div class="col-auto">
      <select id="filtroStato" class="form-select form-select-sm" onchange="renderTabelle()">
        <option value="">Tutti gli stati</option>
        <option value="inviato">Inviato</option>
        <option value="confermato">Confermato</option>
        <option value="fatturato">Fatturato</option>
      </select>
    </div>
    <div class="col">
      <input type="text" id="filtroQ" class="form-control form-control-sm" placeholder="Cerca ordine, cliente, fornitore...">
    </div>
    <div class="col-auto">
      <button class="btn btn-sm btn-outline-secondary" type="submit"><i class="bi bi-search"></i></button>
    </div>
  </form>

  <div class="card">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover mb-0 align-middle" id="tableOrdini">
          <thead class="table-light">
            <tr>
              <th>#</th><th>Ordine</th><th>Data</th><th>Fornitore</th><th>Cliente</th>
              <th class="text-end">Importo</th><th class="text-center">Righe</th><th>Stato</th><th class="text-end">Azioni</th>
            </tr>
          </thead>
          <tbody id="tbodyOrdini"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="mt-3 text-muted small" id="conteggio"></div>
</div>

<!-- Modal Nuovo Ordine -->
<div class="modal fade" id="modalNuovo" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Nuovo Ordine Fornitore</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <form id="formNuovo">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Fornitore *</label>
              <select class="form-select" name="fornitore_id" required><option value="">Seleziona...</option></select>
            </div>
            <div class="col-md-3"><label class="form-label">N. Ordine</label><input type="text" class="form-control" name="numero_ordine" placeholder="OF/2026/0xx"></div>
            <div class="col-md-3"><label class="form-label">Data Ordine</label><input type="date" class="form-control" name="data_ordine"></div>
            <div class="col-md-6">
              <label class="form-label">Cliente</label>
              <select class="form-select" name="cliente_piva"><option value="">Seleziona cliente...</option></select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Importo Merce €</label>
              <input type="number" class="form-control" name="importo_merce" step="0.01">
            </div>
            <div class="col-12"><label class="form-label">Note</label><textarea class="form-control" name="note" rows="2"></textarea></div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Annulla</button>
        <button class="btn btn-primary" onclick="salvaNuovo()">Crea</button>
      </div>
    </div>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
function renderTabelle() {
  const stato = document.getElementById('filtroStato').value;
  const q = document.getElementById('filtroQ').value.trim().toLowerCase();
  const list = DATA.ordini.filter(o => {
    if (stato && o.stato !== stato) return false;
    if (!q) return true;
    const cliente = clienteNome(o.cliente_piva).toLowerCase();
    return (o.numero_ordine || '').toLowerCase().indexOf(q) >= 0 ||
           cliente.indexOf(q) >= 0 ||
           fornitoreNome(o.fornitore_id).toLowerCase().indexOf(q) >= 0;
  });
  const tb = document.getElementById('tbodyOrdini');
  if (!list.length) {
    tb.innerHTML = '<tr><td colspan="9" class="text-center text-muted py-4">Nessun ordine trovato</td></tr>';
  } else {
    tb.innerHTML = list.map(o =>
      '<tr>' +
      '<td class="text-muted small">' + o.id + '</td>' +
      '<td class="fw-semibold"><a href="ordine-fornitore-dettaglio.html?id=' + o.id + '" class="text-decoration-none">' + (o.numero_ordine || '\u2014') + '</a></td>' +
      '<td>' + fmtData(o.data_ordine) + '</td>' +
      '<td>' + fornitoreNome(o.fornitore_id) + '</td>' +
      '<td>' + clienteNome(o.cliente_piva) + '</td>' +
      '<td class="text-end">' + fmtEuro(o.importo_merce) + '</td>' +
      '<td class="text-center"><span class="badge bg-secondary">' + (o.righe || []).length + '</span></td>' +
      '<td><span class="badge badge-stato badge-' + o.stato + '">' + o.stato + '</span></td>' +
      '<td class="text-end">' +
      '<a href="ordine-fornitore-dettaglio.html?id=' + o.id + '" class="btn btn-sm btn-outline-secondary" title="Dettaglio"><i class="bi bi-eye"></i></a> ' +
      '<button class="btn btn-sm btn-outline-danger" onclick="elimina(' + o.id + ')" title="Elimina"><i class="bi bi-trash"></i></button>' +
      '</td></tr>').join('');
  }
  document.getElementById('conteggio').textContent = list.length + ' ordini';
}

function apriModaleNuovo() {
  const f = document.getElementById('formNuovo');
  f.reset();
  const selF = f.querySelector('[name="fornitore_id"]');
  selF.innerHTML = '<option value="">Seleziona...</option>' + DATA.fornitori.map(x => '<option value="' + x.id + '">' + x.ragione_sociale + '</option>').join('');
  const selC = f.querySelector('[name="cliente_piva"]');
  selC.innerHTML = '<option value="">Seleziona cliente...</option>' + DATA.clienti.map(x => '<option value="' + x.piva + '">' + x.ragione_sociale + '</option>').join('');
  new bootstrap.Modal(document.getElementById('modalNuovo')).show();
}

function salvaNuovo() {
  const f = Object.fromEntries(new FormData(document.getElementById('formNuovo')));
  if (!f.fornitore_id) return showToast('Seleziona un fornitore', false);
  const id = Math.max.apply(null, DATA.ordini.map(o => o.id)) + 1;
  DATA.ordini.push({
    id: id, fornitore_id: parseInt(f.fornitore_id), numero_ordine: f.numero_ordine,
    data_ordine: f.data_ordine || new Date().toISOString().split('T')[0],
    cliente_piva: f.cliente_piva, agente_id: 1,
    importo_merce: f.importo_merce ? parseFloat(f.importo_merce) : 0,
    stato: 'inviato', note: f.note || '', righe: []
  });
  showToast('Ordine creato');
  bootstrap.Modal.getInstance(document.getElementById('modalNuovo')).hide();
  renderTabelle();
}

function elimina(id) {
  if (!conferma('Eliminare questo ordine?')) return;
  const i = DATA.ordini.findIndex(o => o.id === id);
  if (i >= 0) DATA.ordini.splice(i, 1);
  renderTabelle();
}

renderTabelle();
</script>
</body>
</html>
