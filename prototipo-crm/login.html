<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login - CRM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/crm.css" rel="stylesheet">
</head>
<body class="login">
<div class="login-card">
  <div class="mb-3">
    <a href="index.html" class="small text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Torna al launcher</a>
  </div>
  <div class="text-center mb-4">
    <img src="assets/img/logo-decobrands.png" alt="CRM"
         style="max-height:56px;max-width:100%;object-fit:contain"
         onerror="this.style.display='none';this.nextElementSibling.style.display='inline-block'">
    <i class="bi bi-box-seam fs-1 text-primary" style="display:none"></i>
    <h5 class="fw-bold mt-2 mb-0">CRM</h5>
    <small class="text-muted">Accedi per continuare</small>
  </div>
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <div class="alert alert-warning py-2 small"><i class="bi bi-info-circle me-1"></i>Prototipo dimostrativo — nessuna autenticazione reale.</div>
      <form onsubmit="event.preventDefault(); location.href='index.html'">
        <div class="mb-3">
          <label class="form-label small fw-semibold">Username o Email</label>
          <input name="username" type="text" class="form-control" autofocus required placeholder="username o indirizzo email" value="admin">
        </div>
        <div class="mb-3">
          <label class="form-label small fw-semibold">Password</label>
          <div class="input-group">
            <input name="password" id="inp-password" type="password" class="form-control" required>
            <button type="button" class="btn btn-outline-secondary" onclick="togglePwd()" tabindex="-1">
              <i class="bi bi-eye" id="pwd-icon"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100">
          <i class="bi bi-box-arrow-in-right me-1"></i>Accedi
        </button>
        <div class="text-center mt-3">
          <span class="small text-muted" style="font-size:.7rem;opacity:.6">v<span id="verPrototipo"></span></span>
        </div>
      </form>
    </div>
  </div>
</div>
<footer class="db-footer">
  <div class="container-fluid px-3 px-md-4">
    <span>© 2026 Ugo Volpato AI Consultant</span>
    <span class="db-footer-sep">·</span>
    <a href="licenza.html">Licenza BSL 1.1</a>
  </div>
</footer>
<script src="assets/js/data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
function togglePwd(){
  const inp=document.getElementById('inp-password');
  const show=inp.type==='password';
  inp.type=show?'text':'password';
  document.getElementById('pwd-icon').className=show?'bi bi-eye-slash':'bi bi-eye';
}
document.getElementById('verPrototipo').textContent = window.VERSIONE_PROTOTIPO || '';
</script>
</body>
</html>
