<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Liquidazione - CRM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/crm.css" rel="stylesheet">
</head>
<body class="crm-app">
<div id="topnav" data-active="liquidazione.html"></div>
<main class="crm-pagina" id="pagina"></main>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/componenti.js"></script>
<script>
/* Composizione: Intestazione + FilterBar + Tabs (KpiRow + DataTable riepilogo | DataTable dettaglio) + Nota */
const intestazione = CRM.Intestazione('#pagina', {
  titolo: 'Liquidazione Provvigioni', icona: 'bi-cash-stack',
  sottotitolo: 'Rendiconto provvigioni subagenti per pratiche fatturate, periodo per periodo'
});

const filtri = CRM.FilterBar('#pagina', {
  reset: true,
  campi: [
    { nome: 'fornitori', tipo: 'multi', etichetta: 'Fornitore', etichettaTutti: 'Tutti i fornitori', etichettaNessuno: 'Nessun fornitore', etichettaParziale: 'Fornitori',
      opzioni: DATA.fornitori.map(x => ({ value: x.id, label: x.ragione_sociale })) },
    { nome: 'subagente', tipo: 'select', etichetta: 'Subagente', opzioni: CRM.opz.subagenti('Tutti i subagenti') },
    { nome: 'trimestre', tipo: 'select', etichetta: 'Trimestre', col: 'col-md-2', valore: 3, opzioni: [
      { value: '', label: 'Tutti i trimestri' }, { value: 1, label: 'Q1' }, { value: 2, label: 'Q2' }, { value: 3, label: 'Q3' }, { value: 4, label: 'Q4' }] },
    { nome: 'anno', tipo: 'numero', etichetta: 'Anno', col: 'col-md-2', placeholder: 'Anno', valore: 2026 }
  ],
  onChange: render
});

const tabs = CRM.Tabs('#pagina', [
  { id: 'riepilogo', etichetta: 'Riepilogo', icona: 'bi-bar-chart' },
  { id: 'dettaglio', etichetta: 'Dettaglio Rendiconto', icona: 'bi-list-ul' }
]);

const kpi = CRM.KpiRow(tabs.pane('riepilogo'), [
  { id: 'doc', etichetta: 'Documenti liquidabili', variante: 'info' },
  { id: 'merce', etichetta: 'Totale merce', variante: 'warning' },
  { id: 'agente', etichetta: 'Provvigione agente' },
  { id: 'subagente', etichetta: 'Provvigione subagenti', variante: 'success' }
]);

const tabRiepilogo = CRM.DataTable(CRM.blocco(tabs.pane('riepilogo'), { riempi: true }), {
  titolo: 'Riepilogo per Subagente', icona: 'bi-people', testataDestra: '<span class="text-muted small">provvigioni da liquidare per subagente</span>',
  colonne: [
    { key: 'subagente', header: 'Subagente', classe: 'fw-semibold', grow: true },
    { key: 'num', header: 'N. Fatture', tipo: 'numero', align: 'center', totale: 'somma' },
    { key: 'merce', header: 'Totale Merce', tipo: 'euro', totale: 'somma' },
    { key: 'provvSub', header: 'Provvigione Subagente', tipo: 'euro', classe: 'fw-bold', totale: 'somma' }
  ],
  rowKey: r => r.subagente,
  emptyText: 'Nessun dato per i filtri selezionati'
});

const tabDettaglio = CRM.DataTable(CRM.blocco(tabs.pane('dettaglio'), { riempi: true }), {
  titolo: 'Rendiconto in dettaglio', icona: 'bi-list-ul',
  azioniTestata: [{ etichetta: 'Esporta CSV (§11)', icona: 'bi-download', variante: 'outline-success', id: 'btn-esporta', onClick: esportaCSV, disabilitato: righe => !righe.length }],
  colonne: [
    { key: 'subagente', header: 'Subagente' },
    { key: 'agente', header: 'Agente' },
    { key: 'fornitore', header: 'Fornitore' },
    { key: 'fattura', header: 'Fattura' },
    { key: 'fattura_data', header: 'Data', tipo: 'data' },
    { key: 'cliente', header: 'Cliente' },
    { key: 'merce', header: 'Merce', tipo: 'euro' },
    { key: 'pct_agente', header: '% Agente', tipo: 'pct' },
    { key: 'pct_subagente', header: '% Sub.', tipo: 'pct' },
    { key: 'pct_totale', header: '% Tot.', tipo: 'pct', classe: 'fw-semibold' },
    { key: 'provv_agente', header: 'Provv Agente', tipo: 'euro' },
    { key: 'provv_subagente', header: 'Provv Sub.', tipo: 'euro' },
    { key: 'provv_totale', header: 'Provv Totale', tipo: 'euro', classe: 'fw-bold' }
  ],
  rowKey: (r, i) => r.fattura + '-' + i,
  emptyText: 'Nessun dato per i filtri selezionati'
});

CRM.Nota('#pagina',
  '<strong>Regole base (§5.4, §5.6, §5.9):</strong> entrano in liquidazione solo le pratiche <strong>fatturate</strong>. ' +
  'Il periodo di riferimento è il trimestre stabilito del subagente (gen-mar / apr-giu / lug-set / ott-dic), calcolato sulla ' +
  'data ordine. L\'export segue i <strong>8 campi</strong> concordati col cliente (§11): fornitore, n° documento, data documento, ' +
  'codice cliente, ragione sociale, importo documento, % provvigione, importo provvigionale.');

function filtriCorrenti() {
  const f = filtri.valori();
  return {
    fornitori: f.fornitori.map(Number),
    subagente: f.subagente,
    trimestre: f.trimestre,
    anno: parseInt(f.anno, 10) || new Date().getFullYear()
  };
}
function righeRendiconto() {
  const filt = filtriCorrenti();
  const out = [];
  DATA.ordini.forEach(o => {
    if (o.stato !== 'fatturato') return;
    if (filt.fornitori.length < DATA.fornitori.length && !filt.fornitori.includes(Number(o.fornitore_id))) return;
    if (filt.trimestre && !inTrimestre(o.data_ordine, filt.trimestre, filt.anno)) return;
    const c = commissionePerOrdine(o);
    if (!c) return;
    if (filt.subagente && c.subagenteId !== parseInt(filt.subagente, 10)) return;
    const s = DATA.subagenti.find(x => x.id === c.subagenteId);
    const a = s ? DATA.agenti.find(x => x.id === s.agente_id) : null;
    out.push(Object.assign({
      subagente: s ? s.nome + ' ' + s.cognome : '—',
      agente: a ? a.nome + ' ' + a.cognome : '—',
      fornitore: fornitoreNome(o.fornitore_id),
      fattura: o.fattura_numero || '—',
      fattura_data: o.fattura_data || o.data_ordine,
      cliente: clienteNome(o.cliente_piva),
      cliente_piva: o.cliente_piva,
      merce: Number(o.importo_merce || 0)
    }, c));
  });
  return out;
}

function render() {
  const p = filtriCorrenti();
  const righe = righeRendiconto();
  intestazione.aggiorna({ destra: '<span class="badge bg-white text-dark border px-3 py-2 fw-semibold"><i class="bi bi-calendar3 me-1"></i>' +
    (p.trimestre ? trimestreLabel(parseInt(p.trimestre, 10)) + ' ' + p.anno : 'Tutti i periodi') + '</span>' });

  kpi.aggiorna('doc', righe.length);
  kpi.aggiorna('merce', fmtEuro0(righe.reduce((s, r) => s + r.merce, 0)));
  kpi.aggiorna('agente', fmtEuro0(righe.reduce((s, r) => s + r.provv_agente, 0)));
  kpi.aggiorna('subagente', fmtEuro0(righe.reduce((s, r) => s + r.provv_subagente, 0)));

  const map = {};
  righe.forEach(r => {
    if (!map[r.subagente]) map[r.subagente] = { subagente: r.subagente, num: 0, merce: 0, provvSub: 0 };
    map[r.subagente].num += 1;
    map[r.subagente].merce += r.merce;
    map[r.subagente].provvSub += r.provv_subagente;
  });
  tabRiepilogo.aggiorna(Object.values(map));
  tabDettaglio.aggiorna(righe);
  tabs.badge('dettaglio', CRM.badgeConteggio(righe.length));
}

/* Export §11: 8 campi concordati col cliente */
function esportaCSV() {
  const righe = righeRendiconto();
  if (!righe.length) return showToast('Nessun dato da esportare', false);
  const header = 'Fornitore;N. Documento;Data Documento;Codice Cliente;Ragione Sociale;Importo Documento;% Provvigione;Importo Provvigionale';
  const rows = righe.map(r => [
    r.fornitore, r.fattura, fmtData(r.fattura_data), r.cliente_piva, r.cliente,
    Number(r.merce).toFixed(2), Number(r.pct_totale).toFixed(2), Number(r.provv_totale).toFixed(2)
  ]);
  exportCSV('liquidazione_provvigioni.csv', header, rows);
  showToast('CSV esportato (' + rows.length + ' righe)');
}

render();
</script>
</body>
</html>
