<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bollettini - CRM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/crm.css" rel="stylesheet">
</head>
<body class="crm-app">
<div id="topnav" data-active="bollettini.html"></div>
<main class="crm-pagina" id="pagina"></main>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/componenti.js"></script>
<script>
/* Composizione: Intestazione + FilterBar + DataTable + Nota */
CRM.Intestazione('#pagina', {
  titolo: 'Bollettini', icona: 'bi-receipt',
  azioni: [{ etichetta: 'Nuovo Bollettino', icona: 'bi-plus-lg', onClick: apriModaleNuovo }]
});

const filtri = CRM.FilterBar('#pagina', {
  card: false,
  campi: [{ nome: 'stato', tipo: 'select', col: 'col-auto', opzioni: [
    { value: '', label: 'Tutti gli stati' }, { value: 'da_verificare', label: 'Da verificare' },
    { value: 'verificato', label: 'Verificato' }, { value: 'contestato', label: 'Contestato' }] }],
  onChange: render
});

const tot = b => bollettinoTotali(b);
const clsDiff = v => v > 0 ? 'text-danger' : v < 0 ? 'text-success' : '';

const tabella = CRM.DataTable(CRM.blocco('#pagina', { riempi: true }), {
  colonne: [
    { key: 'fornitore', header: 'Fornitore', grow: true, valore: b => fornitoreNome(b.fornitore_id),
      cell: b => '<a href="bollettino-dettaglio.html?id=' + b.id + '" onclick="sessionStorage.setItem(\'bollettinoId\',' + b.id + ')" class="text-decoration-none fw-semibold">' + CRM.esc(fornitoreNome(b.fornitore_id)) + '</a>' },
    { key: 'mese', header: 'Mese', sortValue: b => b.mese, cell: b => meseLabel(b.mese) },
    { key: 'anno', header: 'Anno', tipo: 'numero', align: 'left', cell: b => b.anno },
    { key: 'stato', header: 'Stato', tipo: 'stato' },
    { key: 'righe', header: 'Righe', tipo: 'conteggio', valore: b => (b.righe || []).length },
    { key: 'riconosciuto', header: 'Riconosciuto', tipo: 'euro', valore: b => tot(b).riconosciuto },
    { key: 'calcolato', header: 'Calcolato', tipo: 'euro', valore: b => tot(b).calcolato },
    { key: 'differenza', header: 'Differenza', tipo: 'euro', valore: b => tot(b).differenza,
      cell: b => { const d = tot(b).differenza; return '<span class="' + clsDiff(d) + '">' + fmtEuro(d) + '</span>'; } }
  ],
  azioni: [{ icona: 'bi-eye', tooltip: 'Dettaglio', onClick: b => CRM.apriBollettino(b.id) }],
  onRowClick: b => CRM.apriBollettino(b.id),
  emptyText: 'Nessun bollettino presente'
});

CRM.Nota('#pagina',
  '<strong>Confronto (§6.2):</strong> la colonna <em>Calcolato</em> è ricalcolata a runtime dall\'app tramite gli ' +
  'scaglioni del fornitore (sezione §10); la <em>Differenza</em> = Riconosciuto − Calcolato evidenzia in rosso gli ' +
  'importi maggiori del calcolato (da verificare) e in verde i minori.');

function render() {
  const s = filtri.valori().stato;
  tabella.aggiorna(DATA.bollettini.filter(b => !s || b.stato === s));
}

function apriModaleNuovo() {
  CRM.FormModal({
    titolo: 'Nuovo Bollettino', conferma: 'Crea',
    campi: [
      { nome: 'fornitore_id', etichetta: 'Fornitore', obbligatorio: true, tipo: 'select', opzioni: () => CRM.opz.fornitori('Seleziona...') },
      { nome: 'mese', etichetta: 'Mese', obbligatorio: true, tipo: 'select', opzioni: CRM.opz.mesi, valore: meseCorrente(), col: 'col-md-6' },
      { nome: 'anno', etichetta: 'Anno', obbligatorio: true, tipo: 'numero', valore: new Date().getFullYear(), col: 'col-md-6' }
    ],
    onConferma: function (f) {
      if (!f.fornitore_id) { showToast('Seleziona un fornitore', false); return false; }
      const dup = DATA.bollettini.find(b => b.fornitore_id === parseInt(f.fornitore_id, 10) && b.mese === parseInt(f.mese, 10) && b.anno === parseInt(f.anno, 10));
      if (dup) { showToast('Esiste già un bollettino per lo stesso fornitore/mese/anno', false); return false; }
      DATA.bollettini.push({
        id: CRM.nuovoId(DATA.bollettini),
        fornitore_id: parseInt(f.fornitore_id), mese: parseInt(f.mese), anno: parseInt(f.anno),
        stato: 'da_verificare', note: '', righe: []
      });
      showToast('Bollettino creato');
      render();
    }
  });
}

render();
</script>
</body>
</html>
