<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<!-- Impronta della pagina di attesa (D-210): se il controllo periodico non la trova più, l'app è
     tornata e la pagina si ricarica sull'indirizzo chiesto. Non usare questa stringa altrove. -->
<meta name="decobrands-attesa" content="1">
<link rel="icon" href="/favicon.ico" sizes="any">
<title>Decobrands · aggiornamento in corso</title>
<style>
  /* Stessa scena della pagina d'accesso (D-42): fondo scuro, logo e sottotitolo al centro. */
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: grid; place-items: center; padding: 24px 20px 88px; position: relative;
    background: #212529; color: #fff;
    font-family: 'Public Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 14px; line-height: 1.45;
  }
  main { text-align: center; max-width: 34rem; }
  .logo { width: min(340px, 70vw); height: auto; filter: brightness(0) invert(1); }
  .sottotitolo { margin: 10px 0 0; font-size: 15px; color: rgba(255,255,255,.55); letter-spacing: .04em; }
  .attesa { margin-top: 44px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  h1 { margin: 0; font-size: 1.25rem; font-weight: 600; }
  p { margin: 0; color: rgba(255,255,255,.72); }
  .giro {
    width: 26px; height: 26px; border-radius: 50%; flex: none;
    border: 3px solid rgba(255,255,255,.18); border-top-color: #fff;
    animation: gira .9s linear infinite;
  }
  @keyframes gira { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .giro { animation-duration: 3s; } }
  .stato { margin-top: 18px; font-size: 12.5px; color: rgba(255,255,255,.45); }
  footer { position: absolute; left: 16px; right: 16px; bottom: 16px; text-align: center; font-size: 12px; color: rgba(255,255,255,.4); }
</style>
</head>
<body>
<main>
  <img class="logo" src="/logo-decobrands.png" alt="Decobrands">
  <p class="sottotitolo">Sistema Informativo Aziendale</p>
  <div class="attesa">
    <span class="giro" aria-hidden="true"></span>
    <h1>Aggiornamento in corso</h1>
    <p>Stiamo aggiornando il portale. Questa pagina si riapre da sola appena torna disponibile: non serve ricaricare.</p>
  </div>
  <p class="stato" role="status" aria-live="polite">Controllo ogni pochi secondi…</p>
  <noscript><p class="stato">Ricarica la pagina quando il portale è di nuovo disponibile.</p></noscript>
</main>
<footer>© Decobrands S.r.l. · I dati non si perdono</footer>
<script>
  // D-210: finché Caddy risponde con questa pagina (c'è il file di manutenzione) si riprova; appena la
  // risposta non ha più l'impronta, l'app è tornata e si ricarica l'indirizzo chiesto, che è rimasto
  // nella barra (Caddy riscrive, non sposta: /pratiche resta /pratiche).
  (function () {
    var OGNI = 5000;
    function guarda() {
      fetch(location.href, { cache: 'no-store', credentials: 'same-origin' })
        .then(function (r) { return r.ok ? r.text() : Promise.reject(r.status); })
        .then(function (testo) {
          if (testo.indexOf('decobrands-attesa') < 0) location.reload();
          else setTimeout(guarda, OGNI);
        })
        .catch(function () { setTimeout(guarda, OGNI); });
    }
    setTimeout(guarda, OGNI);
  })();
</script>
</body>
</html>
